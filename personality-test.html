<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维度人格测评</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --card: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --accent: #22d3ee;
  --warn: #fbbf24;
  --radius: 12px;
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

#app { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

.view { display: none; }
.view.active { display: block; }

.hero { text-align: center; margin-bottom: 32px; }
.hero h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero.compact { margin-bottom: 20px; }
.subtitle { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
.type-badge { font-size: 1.5rem; font-weight: 600; color: var(--accent); margin-top: 8px; }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,0.06);
}

.card-grid { display: grid; gap: 16px; }
@media (min-width: 640px) { .card-grid { grid-template-columns: 1fr 1fr; } }

.card h2, .card h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }
.card ul { list-style: none; }
.card li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.card li strong { display: block; font-size: 0.95rem; }
.card li span { font-size: 0.82rem; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 20px; border-radius: 8px; border: none;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
  font-family: inherit; transition: background 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
.btn.secondary:hover { background: #475569; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-row.center { justify-content: center; margin-top: 24px; }

.mode-toggle { display: block; padding: 8px 0; cursor: pointer; font-size: 0.9rem; }
.mode-toggle input { margin-right: 8px; accent-color: var(--primary); }

.file-btn { cursor: pointer; }
.hint { font-size: 0.85rem; color: var(--accent); margin-top: 12px; }
.hidden { display: none !important; }

.disclaimer { margin-top: 32px; text-align: center; font-size: 0.8rem; color: var(--muted); }
.disclaimer strong { color: var(--warn); }

/* Test view */
.test-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.progress-wrap { flex: 1; min-width: 120px; }
.progress-bar { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
#progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.3s; width: 0; }
#progress-text { font-size: 0.8rem; color: var(--muted); }
.badge { background: var(--card); padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; color: var(--accent); }

.question-card { background: var(--surface); border-radius: var(--radius); padding: 32px 24px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.06); }
.q-num { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
#question-text { font-size: 1.25rem; font-weight: 500; margin-bottom: 24px; line-height: 1.5; }

.likert { display: flex; flex-direction: column; gap: 8px; }
.likert-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 8px;
  background: var(--card); cursor: pointer;
  border: 2px solid transparent; transition: border-color 0.15s, background 0.15s;
}
.likert-opt:hover { background: #475569; }
.likert-opt.checked, .likert-opt:has(input:checked) { border-color: var(--primary); background: rgba(99,102,241,0.15); }
.likert-opt input { accent-color: var(--primary); width: 18px; height: 18px; }
.likert-opt .num { font-weight: 700; color: var(--primary); min-width: 20px; }
.likert-opt .lbl { font-size: 0.92rem; }

.nav-row { display: flex; justify-content: space-between; gap: 12px; }

/* Result view */
.result-grid { display: grid; gap: 16px; }
@media (min-width: 640px) { .result-grid { grid-template-columns: 1fr 1fr; } }
.full-width { grid-column: 1 / -1; }

.banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
.banner.warn { background: rgba(251,191,36,0.15); color: var(--warn); border: 1px solid rgba(251,191,36,0.3); }

.bars { margin-top: 16px; }
.bar-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 0.82rem; }
.bar-label { color: var(--muted); }
.bar-track { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.bar-value { color: var(--accent); font-weight: 600; min-width: 36px; text-align: right; }

.result-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.result-item .label { display: block; font-size: 0.8rem; color: var(--muted); }
.result-item strong { font-size: 1.05rem; color: var(--accent); }

.detail .tag { display: inline-block; background: rgba(34,211,238,0.15); color: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; margin: 4px 4px 4px 0; }

#interpretation h3 { font-size: 1rem; color: var(--accent); margin: 16px 0 8px; }
#interpretation p { font-size: 0.92rem; color: var(--muted); margin-bottom: 8px; }
#interpretation .meta { font-size: 0.8rem; margin-top: 16px; font-style: italic; }

.facet-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.facet-tag { background: var(--card); padding: 4px 10px; border-radius: 6px; font-size: 0.78rem; color: var(--muted); }

canvas { display: block; margin: 0 auto; }

@media print {
  body { background: #fff; color: #000; }
  .btn-row, .test-header button, .nav-row { display: none; }
  .card { border: 1px solid #ddd; break-inside: avoid; }
}

  </style>
</head>
<body>
  <div id="app">
    <!-- 首页 -->
    <section id="view-home" class="view active">
      <header class="hero">
        <h1>多维度人格测评</h1>
        <p class="subtitle">五档 Likert · 7 大体系 · 约 220 题 · 90–120 分钟</p>
      </header>
      <div class="card-grid">
        <div class="card" id="module-list"></div>
        <div class="card actions-card">
          <h2>开始测试</h2>
          <label class="mode-toggle"><input type="radio" name="mode" value="full" checked /> 完整版（7 模块 · ~220 题）</label>
          <label class="mode-toggle"><input type="radio" name="mode" value="quick" /> 快速版（16型 + 大五 · ~115 题）</label>
          <div class="btn-row">
            <button class="btn primary" id="btn-start">开始测试</button>
            <button class="btn secondary" id="btn-pdf-book">下载题本 PDF</button>
          </div>
          <hr />
          <h3>本地数据</h3>
          <div class="btn-row">
            <button class="btn secondary" id="btn-export">导出 JSON 备份</button>
            <label class="btn secondary file-btn">导入备份<input type="file" id="btn-import" accept=".json" hidden /></label>
            <button class="btn ghost" id="btn-clear">清除记录</button>
          </div>
          <p id="resume-hint" class="hint hidden"></p>
        </div>
      </div>
      <footer class="disclaimer">
        <p>本测评为自研倾向工具，基于 Jung 类型理论等公开框架，<strong>非 MBTI® 官方产品</strong>。结果仅供参考，不能替代专业心理咨询。</p>
      </footer>
    </section>

    <!-- 答题 -->
    <section id="view-test" class="view">
      <header class="test-header">
        <button class="btn ghost" id="btn-back-home">← 返回</button>
        <div class="progress-wrap">
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <span id="progress-text">0 / 0</span>
        </div>
        <span id="module-badge" class="badge"></span>
      </header>
      <div class="question-card">
        <p id="question-num" class="q-num"></p>
        <h2 id="question-text"></h2>
        <div id="likert-options" class="likert"></div>
      </div>
      <div class="nav-row">
        <button class="btn secondary" id="btn-prev">上一题</button>
        <button class="btn primary" id="btn-next">下一题</button>
      </div>
    </section>

    <!-- 结果 -->
    <section id="view-result" class="view">
      <header class="hero compact">
        <h1>测评结果</h1>
        <p id="result-type" class="type-badge"></p>
      </header>
      <div id="consistency-banner" class="banner hidden"></div>
      <div class="result-grid">
        <div class="card">
          <h2>16 型人格</h2>
          <canvas id="chart-mbti" width="280" height="280"></canvas>
          <div id="mbti-bars" class="bars"></div>
          <div id="mbti-detail" class="detail"></div>
        </div>
        <div class="card">
          <h2>大五人格 OCEAN</h2>
          <canvas id="chart-ocean" width="280" height="280"></canvas>
          <div id="ocean-bars" class="bars"></div>
        </div>
        <div class="card">
          <h2>其他维度</h2>
          <div id="other-results"></div>
        </div>
        <div class="card full-width">
          <h2>详细解读</h2>
          <div id="interpretation"></div>
        </div>
      </div>
      <div class="btn-row center">
        <button class="btn primary" id="btn-pdf-result">下载结果 PDF</button>
        <button class="btn secondary" id="btn-copy-md">复制 Markdown</button>
        <button class="btn secondary" id="btn-export-result">导出 JSON</button>
        <button class="btn ghost" id="btn-retest">重新测试</button>
        <button class="btn ghost" id="btn-home-result">返回首页</button>
      </div>
    </section>
  </div>

/**
 * 多维度人格测试计分引擎
 */
const Scoring = (function () {
  const ENNEA_TYPES = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
  const DISC_TYPES = ['D', 'I', 'S', 'C'];
  const RIASEC_TYPES = ['R', 'I', 'A', 'S', 'E', 'C'];
  const OCEAN_DIMS = ['O', 'C', 'E', 'A', 'N'];

  function toPercent(a, b) {
    const total = a + b;
    if (total === 0) return 50;
    return Math.round((a / total) * 100);
  }

  function resolvePair(raw, labelA, labelB) {
    const pctA = toPercent(Math.max(0, raw.a), Math.max(0, raw.b));
    const pctB = 100 - pctA;
    const diff = Math.abs(pctA - 50);
    const letter = pctA >= pctB ? labelA : labelB;
    return { letter, pctA, pctB, labelA, labelB, ambiguous: diff <= 8, raw };
  }

  function scoreMBTI(questions, answers) {
    const raw = { EI: { a: 0, b: 0 }, SN: { a: 0, b: 0 }, TF: { a: 0, b: 0 }, JP: { a: 0, b: 0 } };
    questions
      .filter((q) => q.module === 'M1')
      .forEach((q) => {
        const ans = answers[q.id];
        if (!ans) return;
        const v = q.reverse ? 6 - Number(ans) : Number(ans);
        const weight = v - 3;
        const positive = ['E', 'S', 'T', 'J'].includes(q.pole);
        if (positive) raw[q.dimension].a += weight;
        else raw[q.dimension].b += weight;
      });
    const ei = resolvePair(raw.EI, 'E', 'I');
    const sn = resolvePair(raw.SN, 'S', 'N');
    const tf = resolvePair(raw.TF, 'T', 'F');
    const jp = resolvePair(raw.JP, 'J', 'P');
    return { type: ei.letter + sn.letter + tf.letter + jp.letter, dimensions: { EI: ei, SN: sn, TF: tf, JP: jp } };
  }

  function scoreFacets(questions, answers) {
    const facets = {};
    questions
      .filter((q) => q.module === 'M2')
      .forEach((q) => {
        const ans = answers[q.id];
        if (!ans) return;
        const v = q.reverse ? 6 - Number(ans) : Number(ans);
        if (!facets[q.facet]) facets[q.facet] = { sum: 0, count: 0, label: q.facetLabel };
        facets[q.facet].sum += v;
        facets[q.facet].count += 1;
      });
    Object.keys(facets).forEach((k) => {
      facets[k].avg = Math.round((facets[k].sum / facets[k].count) * 10) / 10;
      facets[k].pct = Math.round(((facets[k].avg - 1) / 4) * 100);
    });
    return facets;
  }

  function scoreAT(questions, answers) {
    let aScore = 0;
    let tScore = 0;
    questions
      .filter((q) => q.module === 'M3')
      .forEach((q) => {
        const ans = answers[q.id];
        if (!ans) return;
        const v = q.reverse ? 6 - Number(ans) : Number(ans);
        if (q.pole === 'A') aScore += v - 3;
        else tScore += v - 3;
      });
    return {
      letter: aScore >= tScore ? 'A' : 'T',
      label: aScore >= tScore ? '自信型 (Assertive)' : '动荡型 (Turbulent)',
      aScore,
      tScore,
    };
  }

  function sumDirect(questions, answers, types) {
    const scores = {};
    types.forEach((t) => (scores[t] = 0));
    questions.forEach((q) => {
      const ans = answers[q.id];
      if (!ans) return;
      const v = q.reverse ? 6 - Number(ans) : Number(ans);
      scores[q.pole] += v - 3;
    });
    return scores;
  }

  function scoreBigFive(questions, answers) {
    const qs = questions.filter((q) => q.module === 'M4');
    const scores = sumDirect(qs, answers, OCEAN_DIMS);
    const perDim = qs.filter((q) => q.pole === 'O').length || 8;
    const maxRaw = perDim * 2;
    const result = {};
    OCEAN_DIMS.forEach((d) => {
      const raw = scores[d];
      const pct = Math.round(((raw + maxRaw) / (maxRaw * 2)) * 100);
      result[d] = { raw, pct: Math.max(5, Math.min(95, pct)), level: pct >= 65 ? '高' : pct <= 35 ? '低' : '中' };
    });
    return result;
  }

  function scoreEnneagram(questions, answers) {
    const scores = sumDirect(
      questions.filter((q) => q.module === 'M5'),
      answers,
      ENNEA_TYPES
    );
    const sorted = ENNEA_TYPES.map((t) => ({ type: t, score: scores[t] })).sort((a, b) => b.score - a.score);
    const primary = sorted[0].type;
    const n = Number(primary);
    const left = String(n === 1 ? 9 : n - 1);
    const right = String(n === 9 ? 1 : n + 1);
    const wing = scores[left] >= scores[right] ? left : right;
    return { primary, wing, scores: sorted, wingLabel: `${primary}w${wing}` };
  }

  function scoreDISC(questions, answers) {
    const scores = sumDirect(questions.filter((q) => q.module === 'M6'), answers, DISC_TYPES);
    const sorted = DISC_TYPES.map((t) => ({ type: t, score: scores[t] })).sort((a, b) => b.score - a.score);
    return { primary: sorted[0].type, secondary: sorted[1].type, scores: sorted };
  }

  function scoreRIASEC(questions, answers) {
    const scores = sumDirect(questions.filter((q) => q.module === 'M7'), answers, RIASEC_TYPES);
    const sorted = RIASEC_TYPES.map((t) => ({ type: t, score: scores[t] })).sort((a, b) => b.score - a.score);
    return { code: sorted.slice(0, 3).map((s) => s.type).join(''), top3: sorted.slice(0, 3), scores: sorted };
  }

  function checkConsistency(questions, answers) {
    const pairs = questions.filter((q) => q.consistencyPair);
    let conflicts = 0;
    pairs.forEach((q) => {
      const v1 = q.reverse ? 6 - Number(answers[q.id]) : Number(answers[q.id]);
      const partner = questions.find((x) => x.id === q.consistencyPair);
      if (!answers[q.id] || !answers[q.consistencyPair] || !partner) return;
      const v2 = partner.reverse ? 6 - Number(answers[q.consistencyPair]) : Number(answers[q.consistencyPair]);
      if (Math.abs(v1 - v2) >= 3) conflicts += 1;
    });
    return {
      reliable: conflicts <= 2,
      conflicts,
      msg: conflicts <= 2 ? '作答一致性良好，结果可信度较高。' : '部分题目作答存在较大矛盾，建议谨慎解读或重新测试。',
    };
  }

  function computeAll(questions, answers) {
    const mbti = scoreMBTI(questions, answers);
    const at = scoreAT(questions, answers);
    return {
      mbti,
      fullType: mbti.type + '-' + at.letter,
      facets: scoreFacets(questions, answers),
      at,
      ocean: scoreBigFive(questions, answers),
      ennea: scoreEnneagram(questions, answers),
      disc: scoreDISC(questions, answers),
      riasec: scoreRIASEC(questions, answers),
      consistency: checkConsistency(questions, answers),
      computedAt: new Date().toISOString(),
    };
  }

  return { computeAll };
})();


const Storage = (function () {
  const KEY = 'personality_test_v1';

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function save(data) {
    localStorage.setItem(KEY, JSON.stringify({ ...data, savedAt: new Date().toISOString() }));
  }

  function clear() {
    localStorage.removeItem(KEY);
  }

  function saveProgress(answers, mode, currentIndex, view) {
    const existing = load() || {};
    save({ ...existing, answers, mode, currentIndex, view, result: existing.result || null });
  }

  function saveResult(result, answers, mode) {
    save({ answers, result, mode, view: 'result', currentIndex: 0 });
  }

  function exportJSON() {
    const data = load();
    if (!data) return false;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `personality-backup-${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.json`;
    a.click();
    URL.revokeObjectURL(url);
    return true;
  }

  function importJSON(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          save(data);
          resolve(data);
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  return { load, save, clear, saveProgress, saveResult, exportJSON, importJSON, KEY };
})();


const Charts = (function () {
  function drawRadar(canvas, labels, values, options = {}) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const size = options.size || 280;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.scale(dpr, dpr);
    const cx = size / 2;
    const cy = size / 2;
    const maxR = size / 2 - 40;
    const n = labels.length;
    const angleStep = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, size, size);
    ctx.strokeStyle = '#e2e8f0';
    ctx.fillStyle = '#64748b';
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    for (let level = 1; level <= 5; level++) {
      ctx.beginPath();
      const r = (maxR * level) / 5;
      for (let i = 0; i <= n; i++) {
        const angle = i * angleStep - Math.PI / 2;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    for (let i = 0; i < n; i++) {
      const angle = i * angleStep - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + maxR * Math.cos(angle), cy + maxR * Math.sin(angle));
      ctx.stroke();
      ctx.fillText(labels[i], cx + (maxR + 22) * Math.cos(angle), cy + (maxR + 22) * Math.sin(angle) + 4);
    }
    ctx.beginPath();
    ctx.fillStyle = 'rgba(99, 102, 241, 0.25)';
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2;
    for (let i = 0; i <= n; i++) {
      const idx = i % n;
      const angle = idx * angleStep - Math.PI / 2;
      const r = maxR * ((values[idx] || 50) / 100);
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawBars(container, items) {
    container.innerHTML = '';
    items.forEach(({ label, value, color }) => {
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `<span class="bar-label">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${value}%;background:${color || '#6366f1'}"></div></div><span class="bar-value">${value}%</span>`;
      container.appendChild(row);
    });
  }

  return { drawRadar, drawBars };
})();

const App = (function () {
  const PT = PERSONALITY_TEST;
  let mode = 'full';
  let activeQuestions = [];
  let currentIndex = 0;
  let answers = {};
  let result = null;

  const views = { home: '#view-home', test: '#view-test', result: '#view-result' };

  function $(sel) { return document.querySelector(sel); }
  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $(views[name]).classList.add('active');
    Storage.saveProgress(answers, mode, currentIndex, name);
  }

  function getQuestionsForMode(m) {
    if (m === 'quick') return PT.questions.filter(q => PT.quickModules.includes(q.module));
    return PT.questions;
  }

  function renderModuleList() {
    const el = $('#module-list');
    el.innerHTML = '<h2>测评模块</h2><ul>' + PT.modules.map(m =>
      `<li><strong>${m.name}</strong><span>${m.desc} · ${PT.questions.filter(q=>q.module===m.id).length} 题</span></li>`
    ).join('') + '</ul>';
  }

  function checkResume() {
    const saved = Storage.load();
    const hint = $('#resume-hint');
    if (saved && saved.answers && Object.keys(saved.answers).length > 0) {
      hint.classList.remove('hidden');
      hint.textContent = `检测到未完成记录（${Object.keys(saved.answers).length} 题已答），点击「开始测试」将继续。`;
    }
  }

  function startTest(resume) {
    mode = document.querySelector('input[name="mode"]:checked').value;
    activeQuestions = getQuestionsForMode(mode);
    if (resume) {
      const saved = Storage.load();
      if (saved && saved.mode === mode && saved.answers) {
        answers = saved.answers;
        currentIndex = Math.min(saved.currentIndex || 0, activeQuestions.length - 1);
        if (saved.result && Object.keys(answers).length >= activeQuestions.length * 0.95) {
          result = saved.result;
          renderResult();
          showView('result');
          return;
        }
      } else {
        answers = {};
        currentIndex = 0;
      }
    } else {
      answers = {};
      currentIndex = 0;
      result = null;
    }
    showView('test');
    renderQuestion();
  }

  function renderQuestion() {
    const q = activeQuestions[currentIndex];
    const mod = PT.modules.find(m => m.id === q.module);
    $('#question-num').textContent = `第 ${currentIndex + 1} / ${activeQuestions.length} 题`;
    $('#question-text').textContent = q.text;
    $('#module-badge').textContent = mod ? mod.name : q.module;
    $('#progress-fill').style.width = ((currentIndex + 1) / activeQuestions.length * 100) + '%';
    $('#progress-text').textContent = `${currentIndex + 1} / ${activeQuestions.length}`;

    const opts = $('#likert-options');
    opts.innerHTML = PT.likertLabels.map((label, i) => {
      const val = i + 1;
      const checked = answers[q.id] == val ? 'checked' : '';
      return `<label class="likert-opt ${checked}"><input type="radio" name="answer" value="${val}" ${checked ? 'checked' : ''} /><span class="num">${val}</span><span class="lbl">${label}</span></label>`;
    }).join('');

    opts.querySelectorAll('input').forEach(input => {
      input.addEventListener('change', () => {
        answers[q.id] = Number(input.value);
        Storage.saveProgress(answers, mode, currentIndex, 'test');
        opts.querySelectorAll('.likert-opt').forEach(l => l.classList.remove('checked'));
        input.closest('.likert-opt').classList.add('checked');
      });
    });

    $('#btn-prev').disabled = currentIndex === 0;
    $('#btn-next').textContent = currentIndex === activeQuestions.length - 1 ? '查看结果' : '下一题';
  }

  function nextQuestion() {
    const q = activeQuestions[currentIndex];
    if (!answers[q.id]) { alert('请选择一个选项'); return; }
    if (currentIndex < activeQuestions.length - 1) {
      currentIndex++;
      renderQuestion();
    } else {
      finishTest();
    }
  }

  function finishTest() {
    const unanswered = activeQuestions.filter(q => !answers[q.id]);
    if (unanswered.length > 0) {
      if (!confirm(`还有 ${unanswered.length} 题未作答，是否仍要提交？`)) return;
    }
    result = Scoring.computeAll(activeQuestions, answers);
    Storage.saveResult(result, answers, mode);
    renderResult();
    showView('result');
  }

      { label: `感觉 S ${d.SN.pctA}%`, value: d.SN.pctA },
      { label: `思考 T ${d.TF.pctA}%`, value: d.TF.pctA },

    ]);

    });
    $('#mbti-detail').innerHTML = mbtiDetail;

    Charts.drawRadar($('#chart-ocean'), Object.values(ol), Object.keys(result.ocean).map(k => result.ocean[k].pct));
    Charts.drawBars($('#ocean-bars'), Object.entries(result.ocean).map(([k,v]) => ({
      label: `${ol[k]} ${v.pct}% (${v.level})`, value: v.pct,

    })));

      <div class="result-item"><span class="label">霍兰德</span><strong>${result.riasec.code}</strong> ${result.riasec.top3.map(t=>interp.riasec[t.type]).join(' · ')}</div>
    `;

    const facets = Object.entries(result.facets).map(([k,f]) => `<span class="facet-tag">${f.label} ${f.pct}%</span>`).join('');
    $('#interpretation').innerHTML = `

      <h3>九型：${en.name || ''}</h3><p>${en.summary || ''}</p>
      <h3>Step II 子维度</h3><div class="facet-wrap">${facets}</div>
      <p class="meta">以上结果为自研算法计算，仅供自我探索参考。同一人格类型在不同情境下表现会有差异。</p>
    `;
  }

  function copyMarkdown() {
    if (!result) return;
    const t = PT.interpretations.mbti[result.mbti.type];
    const md = `# 人格测评结果\n\n- **类型**: ${result.fullType} (${t?.name||''})\n- **九型**: ${result.ennea.wingLabel}\n- **DISC**: ${result.disc.primary}/${result.disc.secondary}\n- **霍兰德**: ${result.riasec.code}\n- **A/T**: ${result.at.label}\n\n## MBTI\n- E ${result.mbti.dimensions.EI.pctA}% / I ${result.mbti.dimensions.EI.pctB}%\n- S ${result.mbti.dimensions.SN.pctA}% / N ${result.mbti.dimensions.SN.pctB}%\n- T ${result.mbti.dimensions.TF.pctA}% / F ${result.mbti.dimensions.TF.pctB}%\n- J ${result.mbti.dimensions.JP.pctA}% / P ${result.mbti.dimensions.JP.pctB}%\n\n${t?.summary||''}\n`;
    navigator.clipboard.writeText(md).then(() => alert('已复制到剪贴板'));
  }

  function bindEvents() {
    $('#btn-start').addEventListener('click', () => startTest(true));
    $('#btn-pdf-book').addEventListener('click', () => PDFExport.downloadQuestionnaire(PT.questions, PT.modules));
    $('#btn-export').addEventListener('click', () => { if (!Storage.exportJSON()) alert('暂无保存记录'); });
    $('#btn-import').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const data = await Storage.importJSON(file);
        if (data.result) { result = data.result; answers = data.answers; mode = data.mode; renderResult(); showView('result'); }
        else { checkResume(); alert('备份已导入'); }
      } catch { alert('导入失败，请检查文件格式'); }
    });
    $('#btn-clear').addEventListener('click', () => { if (confirm('确定清除所有本地记录？')) { Storage.clear(); checkResume(); } });
    $('#btn-back-home').addEventListener('click', () => showView('home'));
    $('#btn-prev').addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
    $('#btn-next').addEventListener('click', nextQuestion);
    $('#btn-pdf-result').addEventListener('click', () => PDFExport.downloadResult(result, PT.interpretations));
    $('#btn-copy-md').addEventListener('click', copyMarkdown);
    $('#btn-export-result').addEventListener('click', () => Storage.exportJSON());
    $('#btn-retest').addEventListener('click', () => { Storage.clear(); startTest(false); });
    $('#btn-home-result').addEventListener('click', () => showView('home'));
  }

  function init() {
    renderModuleList();
    checkResume();
    bindEvents();
    const saved = Storage.load();
    if (saved?.view === 'result' && saved.result) {
      result = saved.result;
      answers = saved.answers || {};
      mode = saved.mode || 'full';
      renderResult();
      showView('result');
    } else if (saved?.view === 'test' && saved.answers) {
      mode = saved.mode || 'full';
      activeQuestions = getQuestionsForMode(mode);
      answers = saved.answers;
      currentIndex = saved.currentIndex || 0;
      showView('test');
      renderQuestion();
    }
  }

  return { init };
})();

document.addEventListener('DOMContentLoaded', () => App.init());

  </script>
</body>
</html>
