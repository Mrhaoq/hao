<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>头像区分色卡 · 前端下载</title>
  <style>
    :root {
      --bg: #eef1f6;
      --ink: #2a3140;
      --muted: #6b7385;
      --panel: rgba(255, 255, 255, 0.72);
      --line: rgba(42, 49, 64, 0.08);
      --accent: #3d6ef5;
      --accent-soft: rgba(61, 110, 245, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 520px at 12% -10%, #dbe7ff 0%, transparent 55%),
        radial-gradient(900px 480px at 90% 0%, #f7d9ef 0%, transparent 50%),
        linear-gradient(180deg, #f7f8fb 0%, var(--bg) 100%);
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }
    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      padding: 4px;
      gap: 4px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .seg button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .seg button:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.7);
    }
    .seg button.active {
      color: #fff;
      background: linear-gradient(135deg, #4f7df8, #3d6ef5);
      box-shadow: 0 6px 14px rgba(61, 110, 245, 0.28);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #4f7df8, #3d6ef5);
      box-shadow: 0 8px 18px rgba(61, 110, 245, 0.25);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 10px 22px rgba(61, 110, 245, 0.32);
    }
    .btn-ghost {
      color: var(--ink);
      background: var(--panel);
      border-color: var(--line);
      backdrop-filter: blur(8px);
    }
    .btn-ghost:hover {
      background: #fff;
    }
    .btn-card {
      width: 100%;
      margin-top: 12px;
      color: var(--accent);
      background: var(--accent-soft);
    }
    .btn-card:hover {
      background: rgba(61, 110, 245, 0.18);
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }
    .item {
      width: 400px;
      max-width: 100%;
    }
    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      font-family: Arial, sans-serif;
      font-size: clamp(84px, 22vw, 140px);
      font-weight: bold;
      letter-spacing: 2px;
      transition: transform 0.2s;
      user-select: none;
      cursor: pointer;
    }
    .card:hover { transform: scale(1.02); }
    .tip {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 440px) {
      .item { width: 100%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>头像区分色卡</h1>
        <p class="sub">四类风格 · 1:1 正方形 · 先选类别再导出 PNG / ZIP</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="seg" id="styleSeg" role="tablist" aria-label="风格类别"></div>
      <div class="actions">
        <button type="button" class="btn-ghost" id="btnPreviewSize">导出尺寸：800×800</button>
        <button type="button" class="btn-primary" id="btnDownloadAll">下载本类 ZIP</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <p class="tip">切换上方类别预览；单张下 PNG，本类打包为 ZIP。导出尺寸对当前类别立即生效。</p>
  </div>

  <script>
    const STYLES = [
      {
        id: "soft",
        name: "柔和渐变",
        cards: [
          { label: "01", colors: ["#fbc2eb", "#a6c1ee"], text: "rgba(255,255,255,0.55)" },
          { label: "02", colors: ["#fddb92", "#d1fdff"], text: "rgba(255,255,255,0.55)" },
          { label: "03", colors: ["#a1c4fd", "#c2e9fb"], text: "rgba(255,255,255,0.55)" },
          { label: "04", colors: ["#d4a5f5", "#f5b8ea"], text: "rgba(255,255,255,0.55)" },
          { label: "05", colors: ["#fbc2eb", "#f6d5f7"], text: "rgba(255,255,255,0.55)" },
          { label: "06", colors: ["#b8e1fc", "#d0f0fd"], text: "rgba(255,255,255,0.55)" },
          { label: "07", colors: ["#fad0c4", "#ffd1ff"], text: "rgba(255,255,255,0.55)" },
          { label: "08", colors: ["#e0c3fc", "#8ec5fc"], text: "rgba(255,255,255,0.55)" },
          { label: "09", colors: ["#f5f7fa", "#c3cfe2"], text: "rgba(255,255,255,0.55)" },
          { label: "10", colors: ["#d4fc79", "#96e6a1"], text: "rgba(255,255,255,0.55)" },
        ],
      },
      {
        id: "solid",
        name: "高对比纯色",
        cards: [
          { label: "01", bg: "#E53935", text: "#FFFFFF" },
          { label: "02", bg: "#FB8C00", text: "#FFFFFF" },
          { label: "03", bg: "#FDD835", text: "#1A1A1A" },
          { label: "04", bg: "#43A047", text: "#FFFFFF" },
          { label: "05", bg: "#00ACC1", text: "#FFFFFF" },
          { label: "06", bg: "#1E88E5", text: "#FFFFFF" },
          { label: "07", bg: "#5E35B1", text: "#FFFFFF" },
          { label: "08", bg: "#D81B60", text: "#FFFFFF" },
          { label: "09", bg: "#6D4C41", text: "#FFFFFF" },
          { label: "10", bg: "#37474F", text: "#FFFFFF" },
        ],
      },
      {
        id: "vivid",
        name: "鲜明渐变",
        cards: [
          { label: "01", colors: ["#FF416C", "#FF4B2B"], text: "rgba(255,255,255,0.92)" },
          { label: "02", colors: ["#F7971E", "#FFD200"], text: "rgba(255,255,255,0.92)" },
          { label: "03", colors: ["#11998E", "#38EF7D"], text: "rgba(255,255,255,0.92)" },
          { label: "04", colors: ["#2193B0", "#6DD5ED"], text: "rgba(255,255,255,0.92)" },
          { label: "05", colors: ["#396AFC", "#2948FF"], text: "rgba(255,255,255,0.92)" },
          { label: "06", colors: ["#8E2DE2", "#4A00E0"], text: "rgba(255,255,255,0.92)" },
          { label: "07", colors: ["#EE0979", "#FF6A00"], text: "rgba(255,255,255,0.92)" },
          { label: "08", colors: ["#00C9FF", "#92FE9D"], text: "rgba(20,40,30,0.75)" },
          { label: "09", colors: ["#FC466B", "#3F5EFB"], text: "rgba(255,255,255,0.92)" },
          { label: "10", colors: ["#F953C6", "#B91D73"], text: "rgba(255,255,255,0.92)" },
        ],
      },
      {
        id: "duotone",
        name: "深色对撞",
        cards: [
          { label: "01", bg: "#1A1A2E", text: "#FF6B6B" },
          { label: "02", bg: "#16213E", text: "#FFD93D" },
          { label: "03", bg: "#0F3460", text: "#4ECDC4" },
          { label: "04", bg: "#1B1B1B", text: "#95E1A3" },
          { label: "05", bg: "#2D132C", text: "#EE5A24" },
          { label: "06", bg: "#0D1B2A", text: "#48CAE4" },
          { label: "07", bg: "#240046", text: "#C77DFF" },
          { label: "08", bg: "#1B4332", text: "#B7E4C7" },
          { label: "09", bg: "#3D0000", text: "#FFBA08" },
          { label: "10", bg: "#212529", text: "#74C0FC" },
        ],
      },
    ];

    const SIZES = [800, 1080, 1600];
    let sizeIndex = 0;
    let styleIndex = 0;

    const grid = document.getElementById("grid");
    const styleSeg = document.getElementById("styleSeg");
    const btnSize = document.getElementById("btnPreviewSize");
    const btnAll = document.getElementById("btnDownloadAll");

    function currentStyle() {
      return STYLES[styleIndex];
    }

    function exportSize() {
      return SIZES[sizeIndex];
    }

    function updateSizeLabel() {
      const s = exportSize();
      btnSize.textContent = `导出尺寸：${s}×${s}`;
    }

    function isGradientCard(card) {
      return Array.isArray(card.colors) && card.colors.length >= 2;
    }

    function cardBackgroundCSS(card) {
      if (isGradientCard(card)) {
        return `linear-gradient(135deg, ${card.colors[0]} 0%, ${card.colors[1]} 100%)`;
      }
      return card.bg;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function renderCardToCanvas(card, styleId, size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const radius = Math.round(size * (30 / 400));

      roundRect(ctx, 0, 0, size, size, radius);
      if (isGradientCard(card)) {
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, card.colors[0]);
        grad.addColorStop(1, card.colors[1]);
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = card.bg;
      }
      ctx.fill();

      ctx.font = `bold ${Math.round(size * 0.35)}px Arial, sans-serif`;
      ctx.fillStyle = card.text;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (styleId === "soft") {
        ctx.shadowColor = "rgba(255, 255, 255, 0.15)";
        ctx.shadowBlur = Math.round(size * 0.05);
        ctx.shadowOffsetY = Math.round(size * 0.01);
      } else if (styleId === "vivid") {
        ctx.shadowColor = "rgba(0, 0, 0, 0.18)";
        ctx.shadowBlur = Math.round(size * 0.03);
        ctx.shadowOffsetY = Math.round(size * 0.008);
      } else {
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
      }
      ctx.fillText(card.label, size / 2, size / 2 + size * 0.01);

      return canvas;
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) reject(new Error("生成图片失败"));
          else resolve(blob);
        }, "image/png");
      });
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
    }

    function crc32(buf) {
      let c = ~0;
      for (let i = 0; i < buf.length; i++) {
        c ^= buf[i];
        for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
      }
      return ~c >>> 0;
    }

    function u16(n) {
      const b = new Uint8Array(2);
      new DataView(b.buffer).setUint16(0, n, true);
      return b;
    }

    function u32(n) {
      const b = new Uint8Array(4);
      new DataView(b.buffer).setUint32(0, n, true);
      return b;
    }

    function concatBytes(parts) {
      const total = parts.reduce((n, p) => n + p.length, 0);
      const out = new Uint8Array(total);
      let offset = 0;
      for (const p of parts) {
        out.set(p, offset);
        offset += p.length;
      }
      return out;
    }

    async function createZip(files) {
      const localParts = [];
      const centralParts = [];
      let offset = 0;

      for (const file of files) {
        const nameBytes = new TextEncoder().encode(file.name);
        const data = file.data;
        const crc = crc32(data);
        const local = concatBytes([
          u32(0x04034b50),
          u16(20), u16(0), u16(0),
          u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length),
          u16(nameBytes.length), u16(0),
          nameBytes, data,
        ]);
        const central = concatBytes([
          u32(0x02014b50),
          u16(20), u16(20), u16(0), u16(0),
          u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length),
          u16(nameBytes.length), u16(0), u16(0),
          u16(0), u16(0), u32(0), u32(offset),
          nameBytes,
        ]);
        localParts.push(local);
        centralParts.push(central);
        offset += local.length;
      }

      const centralDir = concatBytes(centralParts);
      const end = concatBytes([
        u32(0x06054b50),
        u16(0), u16(0),
        u16(files.length), u16(files.length),
        u32(centralDir.length), u32(offset),
        u16(0),
      ]);

      return new Blob([concatBytes([...localParts, centralDir, end])], {
        type: "application/zip",
      });
    }

    async function downloadOne(card) {
      const style = currentStyle();
      const size = exportSize();
      const canvas = renderCardToCanvas(card, style.id, size);
      const blob = await canvasToBlob(canvas);
      triggerDownload(blob, `avatar-${style.id}-${card.label}-${size}.png`);
    }

    async function downloadAll() {
      btnAll.disabled = true;
      const prev = btnAll.textContent;
      btnAll.textContent = "打包中…";
      try {
        const style = currentStyle();
        const size = exportSize();
        const files = [];
        for (const card of style.cards) {
          const canvas = renderCardToCanvas(card, style.id, size);
          const blob = await canvasToBlob(canvas);
          const data = new Uint8Array(await blob.arrayBuffer());
          files.push({ name: `avatar-${style.id}-${card.label}-${size}.png`, data });
        }
        const zip = await createZip(files);
        triggerDownload(zip, `avatar-${style.id}-${size}.zip`);
      } catch (err) {
        console.error(err);
        alert("导出失败，请重试");
      } finally {
        btnAll.disabled = false;
        btnAll.textContent = prev;
      }
    }

    function buildStyleSeg() {
      styleSeg.innerHTML = STYLES.map((style, i) => `
        <button type="button" role="tab" data-index="${i}" class="${i === styleIndex ? "active" : ""}" aria-selected="${i === styleIndex}">
          ${style.name}
        </button>
      `).join("");

      styleSeg.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          styleIndex = Number(btn.dataset.index);
          buildStyleSeg();
          buildGrid();
        });
      });
    }

    function buildGrid() {
      const style = currentStyle();
      grid.innerHTML = style.cards.map((card) => {
        const shadow =
          style.id === "soft"
            ? "text-shadow:0 4px 20px rgba(255,255,255,0.15);"
            : "";
        return `
        <div class="item">
          <div
            class="card"
            data-label="${card.label}"
            style="background:${cardBackgroundCSS(card)};color:${card.text};${shadow}"
          >${card.label}</div>
          <button type="button" class="btn-card" data-label="${card.label}">下载 PNG</button>
        </div>
      `;
      }).join("");

      grid.querySelectorAll(".btn-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          const card = style.cards.find((c) => c.label === btn.dataset.label);
          if (card) downloadOne(card);
        });
      });

      grid.querySelectorAll(".card").forEach((el) => {
        el.addEventListener("click", () => {
          const card = style.cards.find((c) => c.label === el.dataset.label);
          if (card) downloadOne(card);
        });
      });
    }

    btnSize.addEventListener("click", () => {
      sizeIndex = (sizeIndex + 1) % SIZES.length;
      updateSizeLabel();
    });

    btnAll.addEventListener("click", downloadAll);

    updateSizeLabel();
    buildStyleSeg();
    buildGrid();
  </script>
</body>
</html>
