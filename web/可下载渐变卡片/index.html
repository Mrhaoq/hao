<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>柔和渐变卡片 · 前端下载</title>
  <style>
    :root {
      --bg: #eef1f6;
      --ink: #2a3140;
      --muted: #6b7385;
      --panel: rgba(255, 255, 255, 0.72);
      --line: rgba(42, 49, 64, 0.08);
      --accent: #3d6ef5;
      --accent-soft: rgba(61, 110, 245, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1000px 520px at 12% -10%, #dbe7ff 0%, transparent 55%),
        radial-gradient(900px 480px at 90% 0%, #f7d9ef 0%, transparent 50%),
        linear-gradient(180deg, #f7f8fb 0%, var(--bg) 100%);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    button:active { transform: translateY(1px); }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #4f7df8, #3d6ef5);
      box-shadow: 0 8px 18px rgba(61, 110, 245, 0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 10px 22px rgba(61, 110, 245, 0.32);
    }

    .btn-ghost {
      color: var(--ink);
      background: var(--panel);
      border-color: var(--line);
      backdrop-filter: blur(8px);
    }

    .btn-ghost:hover {
      background: #fff;
    }

    .btn-card {
      width: 100%;
      margin-top: 12px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .btn-card:hover {
      background: rgba(61, 110, 245, 0.18);
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }

    .item {
      width: 400px;
      max-width: 100%;
    }

    .card {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      font-family: Arial, sans-serif;
      font-size: clamp(84px, 22vw, 140px);
      font-weight: bold;
      color: rgba(255, 255, 255, 0.55);
      text-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      letter-spacing: 2px;
      transition: transform 0.2s;
      user-select: none;
    }

    .card:hover { transform: scale(1.02); }

    .c1 { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
    .c2 { background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%); }
    .c3 { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
    .c4 { background: linear-gradient(135deg, #d4a5f5 0%, #f5b8ea 100%); }
    .c5 { background: linear-gradient(135deg, #fbc2eb 0%, #f6d5f7 100%); }
    .c6 { background: linear-gradient(135deg, #b8e1fc 0%, #d0f0fd 100%); }
    .c7 { background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%); }
    .c8 { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
    .c9 { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
    .c10 { background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); }

    .tip {
      margin-top: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 440px) {
      .item { width: 100%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>柔和渐变卡片</h1>
        <p class="sub">1:1 正方形预览 · 点击单张或一键导出为 PNG 图片</p>
      </div>
      <div class="actions">
        <button type="button" class="btn-ghost" id="btnPreviewSize">导出尺寸：800×800</button>
        <button type="button" class="btn-primary" id="btnDownloadAll">下载全部 PNG</button>
      </div>
    </header>

    <div class="grid" id="grid"></div>
    <p class="tip">图片由 Canvas 在浏览器本地生成，无需后端。</p>
  </div>

  <script>
    const CARDS = [
      { id: 1, className: "c1", colors: ["#fbc2eb", "#a6c1ee"] },
      { id: 2, className: "c2", colors: ["#fddb92", "#d1fdff"] },
      { id: 3, className: "c3", colors: ["#a1c4fd", "#c2e9fb"] },
      { id: 4, className: "c4", colors: ["#d4a5f5", "#f5b8ea"] },
      { id: 5, className: "c5", colors: ["#fbc2eb", "#f6d5f7"] },
      { id: 6, className: "c6", colors: ["#b8e1fc", "#d0f0fd"] },
      { id: 7, className: "c7", colors: ["#fad0c4", "#ffd1ff"] },
      { id: 8, className: "c8", colors: ["#e0c3fc", "#8ec5fc"] },
      { id: 9, className: "c9", colors: ["#f5f7fa", "#c3cfe2"] },
      { id: 10, className: "c10", colors: ["#d4fc79", "#96e6a1"] },
    ];

    const SIZES = [400, 800, 1200];
    let exportSize = 800;

    const grid = document.getElementById("grid");
    const btnDownloadAll = document.getElementById("btnDownloadAll");
    const btnPreviewSize = document.getElementById("btnPreviewSize");

    function renderCards() {
      grid.innerHTML = CARDS.map((card) => `
        <div class="item">
          <div class="card ${card.className}" data-id="${card.id}">${card.id}</div>
          <button type="button" class="btn-card" data-download="${card.id}">下载 ${card.id}.png</button>
        </div>
      `).join("");
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawCard(card, size) {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const radius = Math.round(size * (30 / 400));
      const fontSize = Math.round(size * (140 / 400));

      // 透明底 + 圆角裁切
      ctx.clearRect(0, 0, size, size);
      roundRect(ctx, 0, 0, size, size, radius);
      ctx.clip();

      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, card.colors[0]);
      gradient.addColorStop(1, card.colors[1]);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
      ctx.shadowColor = "rgba(255, 255, 255, 0.15)";
      ctx.shadowBlur = Math.round(size * 0.05);
      ctx.shadowOffsetY = Math.round(size * 0.01);
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(card.id), size / 2, size / 2 + fontSize * 0.04);

      return canvas;
    }

    function downloadCanvas(canvas, filename) {
      const link = document.createElement("a");
      link.download = filename;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function downloadOne(id) {
      const card = CARDS.find((c) => c.id === id);
      if (!card) return;
      const canvas = drawCard(card, exportSize);
      downloadCanvas(canvas, `gradient-card-${id}.png`);
    }

    async function downloadAll() {
      btnDownloadAll.disabled = true;
      btnDownloadAll.textContent = "正在导出…";
      for (const card of CARDS) {
        const canvas = drawCard(card, exportSize);
        downloadCanvas(canvas, `gradient-card-${card.id}.png`);
        // 部分浏览器对连续下载有节流，稍作间隔
        await new Promise((r) => setTimeout(r, 180));
      }
      btnDownloadAll.disabled = false;
      btnDownloadAll.textContent = "下载全部 PNG";
    }

    function cycleSize() {
      const idx = SIZES.indexOf(exportSize);
      exportSize = SIZES[(idx + 1) % SIZES.length];
      btnPreviewSize.textContent = `导出尺寸：${exportSize}×${exportSize}`;
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-download]");
      if (!btn) return;
      downloadOne(Number(btn.dataset.download));
    });

    btnDownloadAll.addEventListener("click", downloadAll);
    btnPreviewSize.addEventListener("click", cycleSize);

    renderCards();
  </script>
</body>
</html>
